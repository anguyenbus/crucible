openapi: 3.1.0

info:
  title: Guardrail Service — BFF API
  version: 1.1.0
  description: |
    The api-wrapper (BFF) facing contract for the guardrail capability.

    The guardrail service itself is INTERNAL and verdict-only (see the east-west
    twin, guardrail-openapi.yaml). End users never call it directly, and the
    request-time input/output lanes (/check/input/triage, /check/output) are
    orchestrator-internal — they do NOT appear here.

    What the BFF exposes to the UI is the guardrail's OUTCOME on an uploaded
    document. When an officer uploads a case document, the INGESTION pipeline
    scans its chunks through the ingest-time lane (/check/chunks) AFTER chunking
    and BEFORE indexing (services/ingestion/app/pipeline/guard.py). ANY unsafe
    chunk REJECTS the WHOLE document: nothing is indexed, and the upload itself
    fails with a forensic verdict naming which chunk is unsafe and why.

    TWO surfaces, two statuses:
      * SYNCHRONOUS upload rejection — BUILT. The upload call returns the rejection
        inline: ingestion answers 422 `document_rejected` (or, over its SSE stream,
        a terminal `error` frame) carrying the per-chunk forensic detail, which the
        BFF forwards to the UI so the officer immediately sees "this document is not
        safe to ingest — chunk N contains a prompt injection". No persistence needed.
      * PERSISTED verdict read-surface (the GET/recheck endpoints below) — PROPOSED.
        A queryable record of past verdicts + an operator re-check requires a store
        that does not exist yet; this contract is hand-authored ahead of it so the
        BFF/UI review-queue surface can be reviewed. Marked `x-status: proposed`.

    VOCABULARY (new approach, 2026-07-25). A document is `safe` (indexed) or
    `rejected` (NOT indexed — any unsafe chunk). This replaces the earlier
    whole-markdown `clean/flag/quarantine` triage: the ingest lane is now per-chunk
    and reject-whole-doc, and each hit carries FORENSIC attribution (the injection
    label + the char span + an escaped excerpt) so the UI can show exactly which
    text is unsafe. There is no "indexed-but-flagged" state — an unsafe document is
    not indexed at all.

    AUTH: JWT Bearer (same issuer/JWKS as ingestion + eval). `project_id` and
    permissions come from token claims, NEVER a request body. A document that
    belongs to another project returns 404 (no existence leakage), never 403.
    Scopes: `guard:read` (GETs), `guard:admin` (re-check).

servers:
  - url: https://api.internal/guard
    description: Behind the api-wrapper (BFF). CORS + user rate limiting owned by the BFF.

security:
  - bearerAuth: []

tags:
  - name: document-verdicts
    description: Read guard outcomes on uploaded documents; operator re-check.
  - name: health
    description: Liveness.

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness
      security: []
      responses:
        "200":
          description: Alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthzResponse" }

  /v1/guard/documents:
    get:
      tags: [document-verdicts]
      summary: "PROPOSED — list guard verdicts for the caller's project"
      x-status: proposed
      description: |
        List the guard verdicts on the project's recently-uploaded documents,
        newest first. Scope `guard:read`. `project_id` comes from the token;
        results are the caller's project only. Use to render a review queue of
        rejected documents (an unsafe upload is not indexed, so the queue is the
        only durable trace of the rejection — until this store exists, the
        rejection is surfaced only synchronously at upload time).
      parameters:
        - name: verdict
          in: query
          required: false
          schema: { type: string, enum: [safe, rejected] }
          description: Filter by verdict (e.g. only rejected documents).
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: A page of document verdicts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentVerdictList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/guard/documents/{document_id}:
    get:
      tags: [document-verdicts]
      summary: "PROPOSED — the guard verdict for one document"
      x-status: proposed
      description: |
        The recorded guard verdict + per-chunk forensic detail for a single
        uploaded document. Scope `guard:read`. A document outside the caller's
        project returns 404.
      parameters:
        - name: document_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The document's guard verdict.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentVerdictRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Unknown document, or a document in another project (no existence leakage).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/guard/documents/{document_id}/recheck:
    post:
      tags: [document-verdicts]
      summary: "PROPOSED — re-run the ingest-time scan (operator)"
      x-status: proposed
      description: |
        Re-run the ingest-time chunk scan (/check/chunks) for a document — e.g.
        after a guard config bump, or to re-evaluate a suspected false-positive
        rejection. Scope `guard:admin`. Deterministic for an unchanged document +
        unchanged guard config version (the scan is a pure function of the chunks +
        the pinned injection table). A re-check that now returns `safe` may trigger
        ingestion to index the document; that is an ingestion action, not performed
        here.
      parameters:
        - name: document_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The re-computed verdict.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentVerdictRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Missing `guard:admin` scope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Unknown document, or another project's.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer. project_id + scopes from token claims, never the body.

  responses:
    Unauthorized:
      description: Missing / invalid / expired token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    HealthzResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, const: "ok" }

    Error:
      type: object
      required: [detail]
      properties:
        detail: { type: string, description: "Human-readable reason. No internal leakage." }

    ChunkDetection:
      type: object
      description: One injection hit inside a chunk — FORENSIC (label + severity + span + escaped excerpt).
      required: [category, label, severity, char_start, char_end, matched_excerpt]
      properties:
        category: { type: string, description: "prompt_injection | jailbreak | ai_directive | role_impersonation | bidi | invisible_unicode." }
        label: { type: string, description: "The specific rule (e.g. 'ignore_previous', 'dan_persona')." }
        severity: { type: string, enum: [high, medium], description: "Forensic ranking; does not gate the verdict (any hit is unsafe)." }
        char_start: { type: integer, minimum: 0 }
        char_end: { type: integer, minimum: 0 }
        matched_excerpt: { type: string, description: "The matched span; invisible/control codepoints escaped to \\uXXXX so it is legible." }
        context: { type: [string, "null"], description: "A short surrounding window (same escaping) for the operator." }

    ChunkVerdict:
      type: object
      required: [chunk_id, verdict]
      properties:
        chunk_id: { type: string }
        ordinal: { type: [integer, "null"] }
        verdict: { type: string, enum: [safe, unsafe] }
        detections:
          type: array
          items: { $ref: "#/components/schemas/ChunkDetection" }
          description: "Every hit on this chunk; empty when safe."

    DocumentVerdictRecord:
      type: object
      x-status: proposed
      description: The recorded guard outcome for one uploaded document (a projection of the ingest-time /check/chunks verdict).
      required: [document_id, verdict, indexed]
      properties:
        document_id: { type: string }
        source_ref:
          type: [string, "null"]
          description: "The uploaded filename / reference, for the alert."
        verdict:
          type: string
          enum: [safe, rejected]
          description: "safe (indexed) | rejected (any unsafe chunk → NOT indexed)."
        indexed:
          type: boolean
          description: "Whether the document reached the index (true for safe, false for rejected)."
        unsafe_chunk_count:
          type: integer
          minimum: 0
          description: "How many chunks were unsafe (0 for a safe document)."
        detection_count:
          type: integer
          minimum: 0
          description: "Total injection hits across all chunks."
        results:
          type: array
          items: { $ref: "#/components/schemas/ChunkVerdict" }
          description: "Per-chunk forensic detail for the unsafe chunks (the 'which part' the UI renders)."
        guard_config_version:
          type: [string, "null"]
          description: "The pinned guard config version that adjudicated it (audit)."
        checked_at:
          type: [string, "null"]
          format: date-time
          description: "When the verdict was produced (UTC)."

    DocumentVerdictList:
      type: object
      x-status: proposed
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DocumentVerdictRecord" }

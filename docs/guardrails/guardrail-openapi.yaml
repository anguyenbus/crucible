openapi: 3.1.0

info:
  title: Guardrail Service — Internal API
  version: 1.0.0
  description: |
    East-west (service-to-service) contract for the guardrail microservice — a
    verdict-only NeMo Guardrails pod backed EXCLUSIVELY by AWS Bedrock Claude
    Haiku (no OpenAI, no NIM). In-mesh callers only.

    This is the INTERNAL spec. The orchestrator calls the request-time lanes
    (/check/input/triage, /check/output); the ingestion service calls the
    ingest-time lane (/check/chunks) on a document's chunks after chunking and
    before indexing. The BFF twin (guardrail-api.yaml) exposes only the document
    verdict surface to the api-wrapper for the upload flow; the input/output lanes
    are NOT end-user-facing and appear ONLY here.

    STATUS:
      * /check/input, /check/input/triage, /check/output, /check/chunks, /healthz,
        /readyz are AS-BUILT (services/guardrail).
      * /check/chunks is the ingest-time corpus-poisoning lane (Requirement 3):
        deterministic, per-chunk, forensic; ANY unsafe chunk => the caller rejects
        the WHOLE document.

    INVARIANTS (contractual):
      * VERDICT-ONLY. The pod returns a decision + attribution; it NEVER returns
        the caller's text rewritten as authoritative. (The ingest lane's forensic
        `matched_excerpt` / `char_span` locate the offending text for the operator
        alert; they are attribution, not a rewrite.)
      * HONEST 200, NEVER 5xx for a verdict. A block / redirect / flag / reject
        is a 200 with a machine-readable verdict. NeMo's own refusal string is
        NEVER forwarded. A 5xx means a genuine infrastructure fault, not a policy
        decision.
      * FAIL-CLOSED at the caller. When the pod cannot adjudicate, the caller does
        NOT proceed unguarded: the orchestrator fails ATTACK closed; on /check/chunks
        the ingestion caller rejects a document it could not scan (a 503 means the
        scanner failed to compile — never index unscanned). Note the chunk scan is
        deterministic and needs no model, so a Bedrock outage does not disable it.
      * DETERMINISM-PINNED. The config-dir digest + uv.lock sha256 are pinned; the
        pod refuses to serve on drift. Each verdict is reproducible from its inputs
        + the guard config version.
      * BEDROCK-ONLY. `model_id` is STAMPED by the pod from its configured Haiku id
        (NeMo's reported id is unreliable).

    AUTH MODEL — ASSUMPTION, NOT YET RATIFIED (mirrors the eval service proposal).
    Caller authentication is mutualTLS: a request is served only if the mesh
    presents a verified in-mesh peer identity (orchestrator / ingestion / ops). No
    verified peer => 401 before any body parsing. The guardrail holds no tenant
    data and reads no project id — isolation is by network policy + mTLS peer
    allow-listing, not by a body field.

servers:
  - url: https://guardrail.internal
    description: In-mesh (VPC-only). No public endpoint.

security:
  - mtlsPeer: []

tags:
  - name: check
    description: Verdict-only guard checks.
  - name: health
    description: Liveness and readiness probes.

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness
      description: Always 200 while the process serves. No dependency calls.
      security: []
      responses:
        "200":
          description: Alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthzResponse" }

  /readyz:
    get:
      tags: [health]
      summary: Readiness
      description: |
        200 when the ONE reusable LLMRails engine is constructed and the
        deterministic detectors compiled. 503 (with a reason) otherwise. Bedrock
        reachability is proven by the first real /check call, not here.
      security: []
      responses:
        "200":
          description: Ready to serve /check.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadyzResponse" }
        "503":
          description: Not ready (engine not constructed, or a detector failed to compile).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /check/input:
    post:
      tags: [check]
      summary: Binary input self-check (legacy — now a shadow monitor)
      description: |
        Self-check ONE user turn via the enforcing `self check input` rail. Since
        the Group 7 cutover this runs as a PRODUCTION SHADOW regression monitor;
        the active input adjudicator is /check/input/triage. Retained for the
        contract and for shadow comparison.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckInputRequest" }
      responses:
        "200":
          description: Verdict (honest 200; `unsafe=true` is a block, never a 5xx).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckResponse" }
        "503":
          description: Guard engine not initialised.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /check/input/triage:
    post:
      tags: [check]
      summary: Three-way input triage (ATTACK / OFF-TOPIC / OK) — the active input rail
      description: |
        Classify ONE user turn in a single Haiku call. The RAW turn is forwarded
        (never sanitised before the judge). `verdict`: attack (orchestrator blocks),
        offtopic (redirect), ok (allow). `unavailable: true` means the pod could not
        adjudicate — the verdict reads `ok` and the caller applies its layered fail
        policy (ATTACK closed, OFF-TOPIC open) at the boundary.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckInputRequest" }
      responses:
        "200":
          description: Triage verdict (honest 200).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TriageResponse" }
        "503":
          description: Guard engine not initialised.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /check/output:
    post:
      tags: [check]
      summary: Output self-check (deterministic secrets first, then content, optional grounding)
      description: |
        Check a generated answer against its grounding chunks. The deterministic
        secrets/PII detector runs FIRST and short-circuits the paid LLM rail on a
        secret hit. `self check facts` (grounding) runs ONLY when `check_facts` is
        true. PII is deliberately NOT blocked — the cleared officer sees it.
        `flag: true` is the advisory deliver-with-flag signal; never itself a block.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckOutputRequest" }
      responses:
        "200":
          description: Verdict + deterministic detections (honest 200).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckResponse" }
        "503":
          description: Guard engine not initialised.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /check/chunks:
    post:
      tags: [check]
      summary: "Scan a document's chunks for injection at ingest time (per-chunk verdict)"
      x-status: implemented
      description: |
        The ingest-time corpus-poisoning lane (Requirement 3). Called by the
        ingestion service AFTER chunking and BEFORE embed/index: it takes the
        chunks a document was split into and returns a per-chunk safe/unsafe
        verdict with FORENSIC attribution.

        DETERMINISTIC, NO LLM CALL — pure regex over each chunk (the pinned
        `config/injections.yml` table): prompt-injection / jailbreak (DAN, IGNORE,
        developer-mode) / AI-directive (instructions aimed at an AI reviewer) /
        role-impersonation (fake SYSTEM: headers, chat-template tokens) / BIDI +
        zero-width + Unicode-tag smuggling. Because it needs no model, the verdict
        survives a Bedrock outage at zero cost (there is no fail-open path). An
        OPTIONAL one-token Haiku rail for fluent evasions is config-gated and off.

        WHOLE-DOCUMENT POLICY (caller): ANY unsafe chunk sets `safe:false`. The
        ingestion caller then REJECTS THE WHOLE DOCUMENT — indexes nothing — and
        surfaces the forensic results to the frontend ("this document is not safe
        to ingest; chunk N contains a prompt injection"). This is a deliberate
        change from a whole-markdown `/check/document` check: per-chunk gives the
        precise "which part" attribution the alert needs. The 120-token chunk
        overlap covers most boundary-spanning injections; a residual gap (an
        injection split cleanly across two non-overlapping chunks) is accepted for
        the attribution win and is a known limitation.

        FORENSIC CARVE-OUT: unlike the answer lanes (`Detection` — labels + counts,
        no offsets, because the pod never rewrites an answer), each hit here
        carries the `char_start`/`char_end` span and an escaped `matched_excerpt` /
        `context` — invisible/BIDI codepoints escaped to \uXXXX so an unprintable
        hit is still legible. The operator is triaging an uploaded document; seeing
        the offending span IS the job. The pod still only reports — never mutates.

        LIMITATION (contractual): this sees the TEXT. Visual hiding (zero-size /
        off-canvas / colour-hidden / metadata-only text) is destroyed at parse and
        is the parser's job (text-layer-vs-OCR diff), NOT detectable here.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckChunksRequest" }
      responses:
        "200":
          description: Whole-document verdict + per-chunk forensic results.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckChunksResponse" }
        "503":
          description: Injection scanner not initialised (failed to compile).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    mtlsPeer:
      type: mutualTLS
      description: |
        Verified in-mesh peer identity (orchestrator / ingestion / ops). Enforced
        by the mesh; no verified peer => 401 before body parsing.

  schemas:
    HealthzResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, const: "ok", description: "Always 'ok' while serving." }

    ReadyzResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, const: "ready", description: "Engine constructed + detectors compiled." }

    Error:
      type: object
      required: [detail]
      properties:
        detail: { type: string, description: "Human-readable reason. Class name / short prose only — never raw internals." }

    Detection:
      type: object
      description: One deterministic detector hit — labels + counts only, NO spans/offsets (verdict-only).
      required: [category, label, count]
      properties:
        category: { type: string, description: "The class that fired (e.g. 'secrets', 'injection')." }
        label: { type: string, description: "The specific rule (e.g. 'aws_access_key', 'prompt_injection_ai_directed')." }
        count: { type: integer, minimum: 1, description: "How many times the rule matched." }

    CheckInputRequest:
      type: object
      required: [question]
      properties:
        question: { type: string, description: "The RAW user turn to check. Never sanitised before the judge." }

    CheckOutputRequest:
      type: object
      required: [answer]
      properties:
        answer: { type: string, description: "The generated answer to self-check." }
        chunks:
          type: array
          items: { type: string }
          default: []
          description: "Retrieved grounding chunks (evidence for the facts rail)."
        check_facts:
          type: boolean
          default: false
          description: "Run the grounding rail over answer vs chunks (independent facts gate)."

    CheckResponse:
      type: object
      description: Plain-data verdict returned by /check/input and /check/output.
      required: [unsafe, model_id, flag, detections]
      properties:
        unsafe: { type: boolean, description: "true => BLOCK (a rail fired). Honest 200, never a 5xx." }
        rationale:
          type: [string, "null"]
          description: "Terse label (exception type / fail-policy label). NeMo's own refusal string is NEVER forwarded."
        input_tokens: { type: [integer, "null"], description: "Bedrock prompt tokens for the guard call." }
        output_tokens: { type: [integer, "null"], description: "Bedrock completion tokens for the guard call." }
        model_id: { type: string, description: "The configured Haiku id, STAMPED by the pod." }
        flag: { type: boolean, description: "Advisory deliver-with-flag signal (output lane). Never itself a block." }
        detections:
          type: array
          items: { $ref: "#/components/schemas/Detection" }
          description: "Deterministic detector attribution (labels + counts, NO offsets)."

    TriageResponse:
      type: object
      description: Plain-data three-way verdict returned by /check/input/triage.
      required: [verdict, unavailable, model_id]
      properties:
        verdict:
          type: string
          enum: [attack, offtopic, ok]
          description: "attack (block) | offtopic (redirect) | ok (allow). Fails toward 'ok' on an unparseable/absent verdict."
        unavailable:
          type: boolean
          default: false
          description: "true when the pod could NOT adjudicate — verdict defaults to 'ok' and the caller's layered fail policy decides."
        rationale:
          type: [string, "null"]
          description: "Terse reason (exception type / fail label). NeMo's refusal string is NEVER forwarded."
        input_tokens: { type: [integer, "null"] }
        output_tokens: { type: [integer, "null"] }
        model_id: { type: string, description: "The configured Haiku id, stamped by the pod." }

    ChunkInput:
      type: object
      required: [id, text]
      properties:
        id: { type: string, description: "Stable chunk id (ingestion's), echoed on the verdict." }
        text: { type: string, description: "The chunk's extracted text (post-chunking)." }
        ordinal: { type: [integer, "null"], description: "0-based position in the document (forensic ordering only)." }

    CheckChunksRequest:
      type: object
      required: [chunks]
      properties:
        chunks:
          type: array
          items: { $ref: "#/components/schemas/ChunkInput" }
          description: "The document's chunks (post-chunking, pre-index). Empty list = vacuously safe."
        document_id:
          type: [string, "null"]
          description: "Opaque document id, echoed on the response for the ingestion audit record + alert."
        source_ref:
          type: [string, "null"]
          description: "Human-facing source reference (filename / URI), echoed for the alert."

    ChunkDetection:
      type: object
      description: One injection hit in a chunk — FORENSIC (spans + escaped excerpt), unlike Detection.
      required: [category, label, severity, char_start, char_end, matched_excerpt, context]
      properties:
        category: { type: string, description: "prompt_injection | jailbreak | ai_directive | role_impersonation | bidi | invisible_unicode." }
        label: { type: string, description: "The specific rule (e.g. 'ignore_previous', 'dan_acronym')." }
        severity: { type: string, enum: [high, medium], description: "Forensic ranking only; does NOT gate the verdict (any hit is unsafe)." }
        char_start: { type: integer, minimum: 0, description: "0-based start offset of the match in the chunk." }
        char_end: { type: integer, minimum: 0, description: "Exclusive end offset of the match in the chunk." }
        matched_excerpt: { type: string, description: "The exact matched span; invisible/control codepoints escaped to \\uXXXX so it is legible." }
        context: { type: string, description: "A short surrounding window (same escaping) so the operator sees the text in situ." }

    ChunkVerdict:
      type: object
      required: [chunk_id, verdict, detections]
      properties:
        chunk_id: { type: string, description: "The input chunk's id, echoed back." }
        ordinal: { type: [integer, "null"], description: "The input chunk's ordinal, echoed if given." }
        verdict: { type: string, enum: [safe, unsafe], description: "'unsafe' when ANY rule fired on this chunk." }
        detections:
          type: array
          items: { $ref: "#/components/schemas/ChunkDetection" }
          description: "Every hit on this chunk (not deduplicated); empty when safe."

    CheckChunksResponse:
      type: object
      description: Whole-document verdict returned by /check/chunks (deterministic, per-chunk).
      required: [safe, verdict, chunk_count, unsafe_chunk_count, detection_count, results, engine]
      properties:
        safe:
          type: boolean
          description: "true only when EVERY chunk is safe. false => the caller REJECTS the whole document (index nothing) and alerts."
        verdict: { type: string, enum: [clean, unsafe], description: "Whole-document roll-up: 'clean' iff safe." }
        document_id: { type: [string, "null"], description: "Echoed document id (audit + alert)." }
        source_ref: { type: [string, "null"], description: "Echoed source reference (filename / URI)." }
        chunk_count: { type: integer, minimum: 0, description: "How many chunks were scanned." }
        unsafe_chunk_count: { type: integer, minimum: 0, description: "How many chunks were unsafe." }
        detection_count: { type: integer, minimum: 0, description: "Total hits across all chunks (alert roll-up)." }
        results:
          type: array
          items: { $ref: "#/components/schemas/ChunkVerdict" }
          description: "Per-chunk verdicts in input order, each with its detections."
        engine:
          type: string
          const: "deterministic"
          description: "Always 'deterministic' — this lane makes NO LLM call, so the verdict survives a Bedrock outage."

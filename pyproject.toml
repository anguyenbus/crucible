# Repo-root TOOLING config only — NOT a buildable package.
#
# The buildable deliverable is the eval service at services/eval/ (package `app`,
# built by uv_build; see services/eval/pyproject.toml). After the eval->app
# restructure, src/ was removed, so the former root `eval` package + its
# [build-system]/[tool.uv.build-backend] were retired. This file now carries only
# the repo-wide ruff config so `ruff`/`ruff-format` (the pre-commit hooks that run
# across the whole tree, including scripts/ and dev/) format consistently.
#
# pytest / lint-imports / kernel-grep-gate are scoped to services/eval via
# .pre-commit-config.yaml (`uv run --project services/eval ...`).

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["D203", "D212"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["D"]

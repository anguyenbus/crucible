[project]
name = "webui-backend"
version = "0.1.0"
description = "Backend-for-frontend for the Document Analyser webui: projects/documents CRUD over SQLite and an upload -> storage -> ingest bridge onto the ingestion service (HTTP-only; no auth)."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "boto3>=1.35",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "requires_aws: needs live AWS credentials; skipped automatically when credentials are absent",
]

[tool.ruff]
target-version = "py313"

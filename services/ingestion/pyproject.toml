[project]
name = "ingestion"
version = "0.1.0"
description = "Markdown ingestion + hybrid search service (S3/local markdown -> Titan v2 embeddings -> OpenSearch hybrid retrieval)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "boto3>=1.35",
    "opensearch-py>=2.7",
    "requests-aws4auth>=1.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "tiktoken>=0.8",
    "python-multipart>=0.0.12",
    "langchain-text-splitters>=1.1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "requires_aws: needs live AWS credentials and VPC network access; skipped automatically when credentials are absent",
]

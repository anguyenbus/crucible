apiVersion: v1
kind: ServiceAccount
metadata:
  name: guardrail
  # AWS credentials reach the pod ONLY through the ambient chain. On EKS, add the
  # IRSA annotation below at deploy time with the account's own role ARN — it is a
  # role reference, not a credential, and no key material is ever committed:
  #   annotations:
  #     eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/<GUARDRAIL_POD_ROLE>
  # The role needs bedrock:InvokeModel on the Haiku inference profile in
  # ap-southeast-2 and nothing else. Without the annotation the pod falls back to
  # the node role, which is the same ambient chain.

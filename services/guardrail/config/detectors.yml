# Deterministic SECRETS detector table for the pod's FIRST output rail.
#
# The `secrets:` patterns are PORTED VERBATIM (behavior-identical — do NOT
# "improve" detection) from the orchestrator's in-house guard:
#   services/orchestrator/app/orchestrator/guardrails.py
#     `_SECRET_PATTERNS`  -> the `secrets:` block below
# API keys, private keys, JWTs and DB connection URLs are NEVER legitimate
# accounting or legal data, so this half of the table is unambiguous and stays.
#
# THE `pii:` TABLE IS WITHDRAWN (spec 2026-07-23-guardrail-calibration-corrections,
# item 6). It previously carried six entries — credit_card (Luhn-gated), ssn,
# passport, mrn, email, phone. Rationale, recorded here and in the commit:
#   - this is an Australian ACCOUNTING + legal case assistant that must
#     legitimately SEE financial identifiers (ABN, TFN, ACN, BSB + account
#     number) to do the job the user came for — blocking or flagging them
#     deletes the product's primary function;
#   - the shipped patterns were US-SHAPED (`ssn`, `mrn`, US-format `phone`) and
#     never covered the Australian identifier set at all, so they bought no real
#     AU coverage while costing real false positives; and
#   - COMPLIANCE HAS NOT RULED on whether TFN / ABN / ACN / Medicare / email
#     should be guarded in an accounting product, nor on whether the action would
#     be block, flag, or redact.
# DEFERRED, NOT DROPPED. No replacement pattern table is reintroduced in the
# interim. Once compliance rules, the route is Presidio (MIT) via NeMo's
# `sensitive_data_detection` rail, whose AU recognizers carry real checksums.
#
# The by-name extension seam is RETAINED and is reachable FROM THIS FILE: an
# entry may carry `blocks: false` (advisory FLAG instead of a block) and/or
# `validator: <name>` (a pod-side validator resolved by name — `luhn` today —
# for a check that regex cannot express). Every entry below omits both, so every
# shipping rule blocks and runs no validator.
#
# This file is a HASHED ARTIFACT: it is folded into the pod's single
# `config_dir_digest` (see app/config_digest.py `_digest_member_paths`), so a
# regex change becomes a pod `config_version` bump + a fresh orchestrator
# `config_sha256` — one determinism mechanism, no new pin hash. NeMo is told to
# ignore this file via `config/.railsignore` (it is the pod's own data file, not
# a rails/prompts artifact).
#
# Verdict policy (deterministic, no LLM):
#   secrets -> BLOCK (short-circuits the paid self_check_* LLM rails)
#
# Patterns are stored as YAML strings. Case-sensitivity is carried in the pattern
# itself: the table is compiled WITHOUT a global IGNORECASE flag (so vendor
# prefixes like `AKIA` / `sk-ant-` stay exact); the one case-insensitive rule
# (the DB URL) carries its own inline `(?i)` — exactly as in the source module.

secrets:
  - pattern: 'sk-ant-[a-zA-Z0-9\-_]{40,}'
    label: anthropic_api_key
  - pattern: 'AKIA[0-9A-Z]{16}'
    label: aws_access_key
  - pattern: 'sk-(?:proj-)?[a-zA-Z0-9\-_]{40,}'
    label: openai_api_key
  - pattern: 'AIza[0-9A-Za-z\-_]{35}'
    label: google_api_key
  - pattern: 'gh[posur]_[0-9a-zA-Z]{36}'
    label: github_token
  - pattern: 'xox[baprs]-[0-9]{10,13}-[0-9]{10,13}-[a-zA-Z0-9]{24}'
    label: slack_token
  - pattern: 'hf_[a-zA-Z0-9]{34}'
    label: huggingface_token
  - pattern: '-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'
    label: private_key
  - pattern: 'eyJ[a-zA-Z0-9_-]*\.eyJ[a-zA-Z0-9_-]*\.[a-zA-Z0-9_-]*'
    label: jwt_token
  - pattern: '(?i)(?:mongodb(?:\+srv)?|postgres(?:ql)?|mysql|redis)://[^\s]+:[^\s]+@[^\s]+'
    label: database_url

# Evaluation configuration for the eval service

# ============================================================================
# GLOBAL JUDGE CONFIGURATION
# ============================================================================
# The DeepEval LLM-judge is the measuring instrument, so its config is GLOBAL
# across ALL datasets (per-dataset judges make scores incomparable). This
# top-level `judge:` block is the ONLY judge config read by
# app.deepeval.bedrock_provider.get_deepeval_config; the former per-dataset
# `datasets.*.deepeval` judge blocks are no longer read (and have been removed).
#
# Precedence is env > YAML: CRUCIBLE_JUDGE_PROVIDER / CRUCIBLE_JUDGE_MODEL
# override the values here. Defaults are Bedrock + the AU-geographic
# inference-profile judge model so Australian legal/PII data stays in-country.
# The AWS region is NOT set here — it is resolved natively from
# AWS_REGION / AWS_DEFAULT_REGION (see .env.example).
judge:
  enabled: true
  provider: bedrock  # "bedrock" (the only supported provider)
  model: au.anthropic.claude-sonnet-4-5-20250929-v1:0  # judge model ID (au.* inference profile)
  temperature: 0.0
  max_concurrent: 10

datasets:
  legal_rag_bench:
    # Path to Legal RAG Bench corpus (optional if using HuggingFace dataset)
    path: ${DATA_DIR:-data/rag}/legal_rag_bench

    # Cache directory for HuggingFace dataset
    cache_path: ${CACHE_DIR:-data/rag}/legal_rag_bench

    # Embedder configuration for retrieval
    embeddings:
      provider: huggingface
      model: sentence-transformers/all-MiniLM-L6-v2

  gst_legal_rag:
    # Path to GST Legal RAG corpus
    path: ${DATA_DIR:-data/rag}/gst_legal_rag

    # Cache directory for GST dataset (vendored local files)
    cache_path: ${CACHE_DIR:-data/rag}/gst_legal_rag

    # Embedder configuration for retrieval
    embeddings:
      provider: huggingface
      model: sentence-transformers/all-MiniLM-L6-v2

metrics:
  # RAG quality metrics (computed by DeepEval)
  - faithfulness
  - contextual_precision
  - contextual_recall
  - answer_relevancy

# ============================================================================
# DEAD CONFIG — NOT READ. Environment variables are the source of truth.
# ============================================================================
# This `models:` block is retained only as a required-section placeholder; it
# is NOT read by the generator. The RAG generator provider/model is configured
# via the CRUCIBLE_* environment variables (see .env.example):
#   CRUCIBLE_GENERATOR_PROVIDER  (bedrock; the only supported provider)
#   CRUCIBLE_GENERATOR_MODEL     (e.g. au.anthropic.claude-sonnet-4-6)
# AWS region/credentials come from AWS_REGION / the standard credential chain.
# Do NOT add authoritative-looking model config here — env wins.
models: {}

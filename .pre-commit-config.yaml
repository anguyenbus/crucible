default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # import-linter boundary gate for services/eval: kernel-pure / app-not-dev /
      # api-not-scoring (root_package = "app"). The repo has no CI, so pre-commit
      # is the only gate.
      - id: lint-imports
        name: lint-imports
        entry: uv run --project services/eval lint-imports
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: pytest
        entry: uv run --project services/eval pytest
        language: system
        pass_filenames: false
        always_run: true

version: "3.8"

services:
  crucible:
    build:
      context: .
      target: runtime
    image: crucible:latest
    container_name: crucible

    # Volume mounts for I/O
    volumes:
      # Evaluation results (read-write) - results written here
      - ./results:/work/results:rw

    # Environment variables
    environment:
      - CRUCIBLE_LOG_LEVEL=${CRUCIBLE_LOG_LEVEL:-INFO}

    # Restart policy (manual control for development)
    restart: "no"

    # Default command shows help
    command: ["--help"]
